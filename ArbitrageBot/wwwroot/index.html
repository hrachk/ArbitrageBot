<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ArbitrageBot</title>
  <meta name="theme-color" content="#121722">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23182030'/%3E%3Cpath d='M7 21h7' stroke='%234fb3ff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M18 11h7' stroke='%23b48cff' stroke-width='3' stroke-linecap='round'/%3E%3Cpath d='M14 21l4-10' stroke='%236fdca0' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/ui/app.css">
</head>
<body>
  <div class="app">
    <aside class="rail" aria-label="Навигация">
      <div class="brand">
        <!-- Mark: the low long leg, the high short leg, and the convergence between them -->
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#1f293c"/>
          <path d="M7 21h7" stroke="#4fb3ff" stroke-width="3" stroke-linecap="round"/>
          <path d="M18 11h7" stroke="#b48cff" stroke-width="3" stroke-linecap="round"/>
          <path d="M14 21l4-10" stroke="#6fdca0" stroke-width="2.4" stroke-linecap="round"/>
        </svg>
        <div><div class="brand-name">ArbitrageBot</div><div class="brand-sub">межбиржевой хедж перпов</div></div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="rail-foot" id="railFoot"></div>
    </aside>

    <div class="main">
      <header class="strip" id="strip"></header>
      <main class="page" id="page" tabindex="-1"></main>
    </div>
  </div>

  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true" aria-labelledby="drawerTitle" role="dialog">
    <div class="drawer-head">
      <h3 id="drawerTitle">Маршрут</h3>
      <span style="flex:1"></span>
      <button class="btn ghost sm" id="drawerClose" aria-label="Закрыть панель маршрута">Закрыть</button>
    </div>
    <div class="drawer-body" id="drawerBody"></div>
  </aside>

  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="chart-tip" id="tip" aria-hidden="true"></div>

  <noscript>Для работы консоли нужен JavaScript.</noscript>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.7/signalr.min.js" defer></script>
  <script src="/assets/ui/app.js" defer></script>
</body>
</html>
